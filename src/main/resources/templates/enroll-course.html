<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <!-- Navbar -->
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <!-- HEADER -->
            <div class="bg-primary text-white rounded-3 p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <h2 class="mb-1">Enroll Student to Courses</h2>
                    <a th:href="@{/students/list}" class="btn btn-light text-primary">
                        <i class="bi bi-arrow-left me-1"></i> Back to Students
                    </a>
                </div>
            </div>

			<form th:action="@{/enrollments/enrollCourse}" 
			      th:object="${enrollmentDto}" 
			      method="post">

			    <!-- ✅ ADD HERE -->
			    <input type="hidden"
			           th:name="${_csrf.parameterName}"
			           th:value="${_csrf.token}" />

			    <!-- rest of your form -->
                

                <div class="row g-4">

                    <!-- LEFT SIDE (COURSES) -->
                    <div class="col-lg-8">
                        <div class="card shadow-sm">
                            <div class="card-header bg-white">
                                <i class="bi bi-list-check me-1"></i> Course Selection
                            </div>

                            <div class="card-body">

                                <!-- Course Validation -->
                                <div class="invalid-feedback d-block"
                                     th:if="${#fields.hasErrors('courseIds')}"
                                     th:errors="*{courseIds}">
                                </div>

                                <table class="table table-hover">
                                    <thead>
                                    <tr>
                                        <th>Select</th>
                                        <th>Course Name</th>
                                        <th class="text-end">Fee</th>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:each="course : ${courseList}">
                                        <td>
                                            <input type="checkbox"
                                                   class="form-check-input course-checkbox"
                                                   th:field="*{courseIds}"
                                                   th:value="${course.id}"
                                                   th:id="'course-' + ${course.id}"
                                                   th:data-name="${course.courseName}"
                                                   th:data-fee="${course.fee}" />
                                        </td>

                                        <td th:text="${course.courseName}"></td>

                                        <td class="text-end"
                                            th:text="'Rs. ' + ${course.fee}">
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT SIDE -->
                    <div class="col-lg-4">
                        <div class="card shadow-sm">
                            <div class="card-header bg-white">
                                <i class="bi bi-person-check me-1"></i> Student & Summary
                            </div>

                            <div class="card-body">

                                <!-- SELECT STUDENT -->
                                <label class="form-label">Select Student</label>
                                <select id="studentSelect"
                                        class="form-select mb-3"
                                        th:field="*{studentId}"
                                        th:classappend="${#fields.hasErrors('studentId')} ? 'is-invalid' : ''">

                                    <option value="">Select a student</option>

                                    <option th:each="student : ${studentList}"
                                            th:value="${student.id}"
                                            th:data-name="${student.firstName + ' ' + student.lastName}"
                                            th:data-email="${student.email}"
                                            th:text="${student.firstName + ' ' + student.lastName + ' (' + student.email + ')'}">
                                    </option>
                                </select>

                                <!-- Student Validation -->
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('studentId')}"
                                     th:errors="*{studentId}">
                                </div>

                                <!-- SELECTED STUDENT -->
                                <div class="border rounded p-2 mb-3">
                                    <strong>Selected Student</strong><br>
                                    <span id="selectedStudent">-</span><br>
                                    <small id="selectedEmail" class="text-muted"></small>
                                </div>

                                <!-- COURSE SUMMARY -->
                                <div class="border rounded p-2 mb-3">
                                    <strong>Courses Selected</strong><br>
                                    Count: <span id="selectedCourseCount">0</span><br>
                                    Total Fee: <span id="totalfees">Rs. 0</span>
                                </div>

                                <!-- SELECTED COURSES -->
                                <div class="border rounded p-2 mb-3">
                                    <strong>Selected Courses</strong>
                                    <ul id="selectedCourses" class="mb-0">
                                        <li>No course selected</li>
                                    </ul>
                                </div>

                                <!-- BUTTONS -->
                                <div class="d-flex gap-2">
                                    <a th:href="@{/students/list}" 
                                       class="btn btn-outline-secondary w-50">
                                        Cancel
                                    </a>

                                    <button type="submit" 
                                            class="btn btn-primary w-50">
                                        Enroll
                                    </button>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<div th:replace="~{fragments/layout :: scripts}"></div>

<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", () => {

    const checkboxes = document.querySelectorAll(".course-checkbox");
    const selectedCourseCount = document.getElementById("selectedCourseCount");
    const totalfees = document.getElementById("totalfees");
    const selectedCourses = document.getElementById("selectedCourses");

    const selectedStudent = document.getElementById("selectedStudent");
    const selectedEmail = document.getElementById("selectedEmail");
    const studentSelect = document.getElementById("studentSelect");

    function updateSummary() {
        let selected = [];
        let total = 0;

        checkboxes.forEach(cb => {
            if (cb.checked) {
                selected.push({
                    name: cb.dataset.name,
                    fee: parseFloat(cb.dataset.fee || "0")
                });
                total += parseFloat(cb.dataset.fee || "0");
            }
        });

        selectedCourseCount.textContent = selected.length;
        totalfees.textContent = "Rs. " + total;

        selectedCourses.innerHTML = "";

        if (selected.length === 0) {
            selectedCourses.innerHTML = "<li>No course selected</li>";
        } else {
            selected.forEach(item => {
                const li = document.createElement("li");
                li.textContent = item.name + " - Rs. " + item.fee;
                selectedCourses.appendChild(li);
            });
        }
    }

    function updateStudent() {
        const selectedOption = studentSelect.options[studentSelect.selectedIndex];

        if (selectedOption && selectedOption.value !== "") {
            selectedStudent.textContent = selectedOption.dataset.name;
            selectedEmail.textContent = selectedOption.dataset.email;
        } else {
            selectedStudent.textContent = "-";
            selectedEmail.textContent = "";
        }
    }

    checkboxes.forEach(cb => cb.addEventListener("change", updateSummary));
    studentSelect.addEventListener("change", updateStudent);

});
</script>

</body>
</html>
