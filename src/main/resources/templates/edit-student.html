<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <!-- Navbar -->
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Edit Student</h2>

                <a th:href="@{/students/list}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Back to List
                </a>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <i class="bi bi-person-lines-fill me-1"></i> Edit Student Details
                </div>

                <div class="card-body">

                    <!-- ✅ FIXED ACTION (IMPORTANT) -->
					<form th:action="${studentDto.id} != null 
					        ? @{/students/{id}/update(id=${studentDto.id})} 
					        : @{/students/save}"
					      th:object="${studentDto}"
					      method="post">
                    
                        <!-- Hidden ID -->
                        <input type="hidden" th:field="*{id}"/>

                        <!-- CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <!-- First + Last Name -->
                        <div class="row mb-3">

                            <div class="col-md-6">
                                <label class="form-label">First Name</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{firstName}"
                                       placeholder="First Name">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Last Name</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{lastName}"
                                       placeholder="Last Name">
                            </div>

                        </div>

                        <!-- Email + Phone -->
                        <div class="row mb-3">

                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email"
                                       class="form-control"
                                       th:field="*{email}"
                                       placeholder="Email">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Phone Number</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{phoneNumber}"
                                       placeholder="Phone Number">
                            </div>

                        </div>

                        <!-- Address -->
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control"
                                      th:field="*{address}"
                                      rows="3"
                                      placeholder="Address"></textarea>
                        </div>

                        <!-- Active -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Is Active</label>
                                <select class="form-select" th:field="*{active}">
                                    <option th:value="true">Yes</option>
                                    <option th:value="false">No</option>
                                </select>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-end">
                            <button type="reset" class="btn btn-light me-2">Reset</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i> Update Student
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Scripts -->
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
