<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Student Management System</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

	<!-- ✅ FIXED -->
	<link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

	<div th:fragment="sidebar" id="sidebar-wrapper">
		<div class="sidebar-heading">SMS Admin</div>

		<div class="list-group list-group-flush">
			<a th:href="@{/dashboard}" class="sidebar-link">Dashboard</a>
			<a th:href="@{/courses/list}" class="sidebar-link">Courses</a>
			<a th:href="@{/students/list}" class="sidebar-link">Students</a>
			<a th:href="@{/enrollments/enrollmentList}" class="sidebar-link">Enrolled Students</a>
			<a th:href="@{/enrollments/enroll}" class="sidebar-link">Enroll to course</a>

			<!-- ✅ Correct Logout -->
			<form th:action="@{/logout}" method="post" class="m-0">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<button type="submit" class="sidebar-link border-0 bg-transparent text-start w-100">
					Logout
				</button>
			</form>
		</div>
	</div>

	<div th:fragment="navbar">
		<nav class="navbar bg-light">
			<span class="navbar-brand">Dashboard</span>
		</nav>
	</div>

	<footer th:fragment="footer" class="text-center p-3">
		© Student Management System
	</footer>

	<th:block th:fragment="scripts">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
		<script>
			window.addEventListener('DOMContentLoaded', event => {
				const sidebarToggle = document.body.querySelector('#sidebarToggle');
				if (sidebarToggle) {
					sidebarToggle.addEventListener('click', event => {
						event.preventDefault();
						document.body.classList.toggle('sb-sidenav-toggled');
					});
				}
			});
		</script>
	</th:block>

</body>

</html>
