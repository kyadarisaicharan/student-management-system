<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">

        <!-- Navbar -->
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Courses</h2>

                <a th:href="@{/courses/new}" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i> Add New Course
                </a>
            </div>

            <!-- ✅ Success Message (Improved) -->
            <div th:if="${message}"
                 class="alert alert-success alert-dismissible fade show"
                 role="alert">

                <span th:text="${message}"></span>

                <button type="button" class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <i class="bi bi-table me-1"></i> Course List
                </div>

                <div class="card-body">

                    <!-- No Data -->
                    <div class="text-muted"
                         th:if="${courses == null or courses.content.isEmpty()}">
                        No courses found
                    </div>

                    <!-- Table -->
                    <div th:if="${courses != null and !courses.content.isEmpty()}">

                        <div class="table-responsive">
                            <table class="table table-hover table-striped">

                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Course Name</th>
                                    <th>Course Code</th>
                                    <th>Course Fees</th>
                                    <th>Duration</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>

                                <tbody>

                                <tr th:each="course : ${courses.content}">
                                    <td th:text="${course.id}"></td>
                                    <td th:text="${course.courseName}"></td>
                                    <td th:text="${course.courseCode}"></td>
                                    <td th:text="${course.fee}"></td>
                                    <td th:text="${course.duration}"></td>

                                    <td>
                                        <!-- View -->
                                        <a th:href="@{/courses/{id}(id=${course.id})}"
                                           class="btn btn-sm btn-info text-white me-1"
                                           title="View">
                                            <i class="bi bi-eye"></i>
                                        </a>

                                        <!-- Edit -->
                                        <a th:href="@{/courses/{id}/edit(id=${course.id})}"
                                           class="btn btn-sm btn-warning text-white me-1"
                                           title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                    </td>
                                </tr>

                                <!-- ✅ Empty fallback inside table -->
                                <tr th:if="${courses.content.isEmpty()}">
                                    <td colspan="6" class="text-center text-muted">
                                        No courses found
                                    </td>
                                </tr>

                                </tbody>

                            </table>
                        </div>

                        <!-- Pagination -->
                        <nav th:if="${courses.totalPages > 1}"
                             aria-label="Course pagination">

                            <ul class="pagination justify-content-end">

                                <!-- Previous -->
                                <li class="page-item"
                                    th:classappend="${courses.first} ? 'disabled'">

                                    <a class="page-link"
                                       th:href="@{/courses/list(page=${courses.number > 0 ? courses.number - 1 : 0}, size=${courses.size})}">
                                        Previous
                                    </a>
                                </li>

                                <!-- Page Numbers -->
                                <li class="page-item"
                                    th:each="pageNum : ${#numbers.sequence(0, courses.totalPages - 1)}"
                                    th:classappend="${pageNum == courses.number} ? 'active' : ''">

                                    <a class="page-link"
                                       th:href="@{/courses/list(page=${pageNum}, size=${courses.size})}"
                                       th:text="${pageNum + 1}">
                                    </a>
                                </li>

                                <!-- Next -->
                                <li class="page-item"
                                    th:classappend="${courses.last} ? 'disabled'">

                                    <a class="page-link"
                                       th:href="@{/courses/list(page=${courses.last ? courses.number : courses.number + 1}, size=${courses.size})}">
                                        Next
                                    </a>
                                </li>

                            </ul>

                        </nav>

                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Scripts -->
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
